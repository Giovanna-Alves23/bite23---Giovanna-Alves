<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BITE 23 | Restaurante</title>

    <link rel="stylesheet" href="bit23.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&dis">
</head>

<body onload="mostrarRestaurante()" class="background">
    <div class="header">
        <div class="container">
            <h1 class="titulo">BITE 23</h1>
            <ul class="navbar">
                <li>
                    <a href="home.html"><img src="icon/home.png"></a>
                </li>
                <li class="agora">
                    <a href="#"><img src="icon/search.png"></a>
                </li>
                <li>
                    <a href="quiz.html"><img src="icon/star.png"></a>
                </li>
            </ul>
        </div>
    </div>

    <div class="banner_restaurante">
        <a href="sugestao.html" class="voltar"><img class="img1" src="icon/setinha.png"></a>
        <div class="container">
            <div class="texto1" id="nome_restaurante" placeholder="nome">nome</div>

            <div class="search">

                <div class="section_buscar">
                    <div class="item_buscar">
                        <label>Descrição:</label>
                        <div class="inp" id="div_descricao" type="text">
                        </div>
                    </div>

                    <div class="item_buscar">
                        <label>Horários</label>
                        <div class="inp" id="div_horario" type="text">
                        </div>
                    </div>
                </div>

                <div class="selects">
                    <div class="item_buscar">
                        <label>Localização:</label>
                        <div class="inp" id="div_localizacao">
                        </div>
                    </div>

                    <div class="visita">
                        <input class="check_visita" type="checkbox" id="visitou">
                        <label for="visita">Já visitei!</label>
                    </div>


                </div>

            </div>
        </div>

    </div>

    <div class="adicionais">

        <div class="anotacao">
            <label for="anotacao">SUA ANOTAÇÃO</label>
            <div class="container1">
                <textarea id="inp_anotacao" type="text"></textarea>
            </div>
        </div>

        <div class="classificacao">
            <label for="classificacao">SUA CLASSIFICAÇÃO</label>
            <div class="estrela">
                <input type="radio" id="estrela5" name="classificacao" value="5" />
                <label for="estrela5">★</label>
                <input type="radio" id="estrela4" name="classificacao" value="4" />
                <label for="estrela4">★</label>
                <input type="radio" id="estrela3" name="classificacao" value="3" />
                <label for="estrela3">★</label>
                <input type="radio" id="estrela2" name="classificacao" value="2" />
                <label for="estrela2">★</label>
                <input type="radio" id="estrela1" name="classificacao" value="1" />
                <label for="estrela1">★</label>
            </div>
        </div>

    </div>
    <div class="botoes">
        <div>
            <button class="button1" onclick="anotar()">ANOTAR</button><br>
        </div>

        <div>
            <button class="button1" onclick="ver_anotacoes()">VER ANOTAÇÕES DE USUÁRIOS</button>
        </div>
    </div>
    </div>

    <div class="comentarios" id="comentarios"></div>


</body>

</html>
<script>

    function mostrarRestaurante() {
        const parametros = new URLSearchParams(window.location.search);
        const fkRestaurante = parametros.get("id");
        let fkUsuario = sessionStorage.ID_USUARIO;

        fetch(`http://localhost:3333/restaurantes/buscarPorId`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                fkUsuarioServer: fkUsuario,
                fkRestauranteServer: fkRestaurante
            }),
        })
            .then(resposta => resposta.json())
            .then(dados => {
                nome_restaurante.innerHTML = dados.nomeRestaurante;
                div_descricao.innerHTML = dados.descricao;
                div_horario.innerHTML = dados.horario;
                div_localizacao.innerHTML = dados.localizacao;
                inp_anotacao.value = dados.anotacao;

                if (dados.anotacao != null) {
                    visitou.checked = true;
                }

                if (dados.classificacao > 0) { // pega qual a classificação do restaurante (ex: estrela4)
                    document.getElementById(`estrela${dados.classificacao}`).checked = true;
                }

            })
            .catch(erro => {
                console.log(erro);
            });
    }

    function anotar() {
        let anotacao = inp_anotacao.value;
        let star = 0;

        let fkUsuario = sessionStorage.ID_USUARIO;
        const parametros = new URLSearchParams(window.location.search);
        let fkRestaurante = parametros.get("id");

        let estrelaSelecionada = document.querySelector('input[name="classificacao"]:checked');

        if (estrelaSelecionada) {
            star = Number(estrelaSelecionada.value);
        }

        // Enviando o valor da nova input
        fetch(`http://localhost:3333/restaurantes/anotar`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/restaurantes.js
                fkUsuarioServer: fkUsuario,
                fkRestauranteServer: fkRestaurante,
                anotacaoServer: anotacao,
                starServer: star
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {

                    setTimeout(() => {
                        alert('Sua anotação e classificação foram guardadas!');
                    }, "1000");

                } else {
                    throw "Houve um erro ao tentar cadastrar anotação e classificação!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }

    function ver_anotacoes() {
        const parametros = new URLSearchParams(window.location.search);
        const fkRestaurante = parametros.get("id");

        let comentarios = document.getElementById('comentarios');
        comentarios.innerHTML = ``;

        fetch(`http://localhost:3333/restaurantes/verAnotacao`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                fkRestauranteServer: fkRestaurante
            }),

        })
            .then(resposta => resposta.json())
            .then(dados => {

                for (let i = 0; i < dados.length; i++) {

                    let estrelas = "☆☆☆☆☆";

                    if (dados[i].classificacao) {
                        estrelas = "★".repeat(dados[i].classificacao) + "☆".repeat(5 - dados[i].classificacao);
                    }

                    comentarios.innerHTML +=
                        `<div class="box_comentarios">
                    <h2>${dados[i].nomeUsuario}</h2>
                    <p> ${dados[i].anotacao}</p>
                    <p class="star">${estrelas}</p>
                    </div>`;
                }
                comentarios.scrollIntoView({ behavior: "smooth" });

            })
            .catch(erro => {
                console.log(erro);
            });
    }

</script>
