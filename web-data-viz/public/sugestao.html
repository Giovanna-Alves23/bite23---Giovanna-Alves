<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BITE 23 | Search</title>

  <link rel="stylesheet" href="bit23.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&dis">
</head>

<body onload="esconder()" class="background">
  <div class="header">
    <div class="container">
      <h1 class="titulo">BITE 23</h1>
      <ul class="navbar">
        <li>
          <a href="index.html"><img src="icon/home.png"></a>
        </li>
        <li class="agora">
          <a href="#"><img src="icon/search.png"></a>
        </li>
        <li>
          <a href="quiz.html"><img src="icon/star.png"></a>
        </li>
      </ul>
    </div>
  </div>

  <div class="banner2">
    <div class="container">
      <div class="texto1">BUSCAR AVENTURAS</div>

      <div class="search">

        <div class="section_buscar">
          <div class="item_buscar">
            <label>vibe</label>
            <div>
              <select class="inp" id="sel_vibe">
                <option class="option" selected disabled value="#"></option>
                <option class="option" value="aconchegante">Aconchegante</option>
                <option class="option" value="romantica">Romantica</option>
                <option class="option" value="despojada">Despojada</option>
                <option class="option" value="classica">Clássica</option>
                <option class="option" value="chique">Chique</option>
              </select>
            </div>
          </div>

          <div class="item_buscar">
            <label>categoria</label>
            <div>
              <select class="inp" id="sel_categoria">
                <option class="option" selected disabled value="#"></option>
                <option class="option" value="hamburguer">Hamburguer</option>
                <option class="option" value="pizza">Pizza</option>
                <option class="option" value="sushi">Sushi</option>
                <option class="option" value="comida">Comida</option>
                <option class="option" value="massa">Massa</option>
                <option class="option" value="hotdog">Hotdog</option>
                <option class="option" value="pastel">Pastel</option>
              </select>
            </div>
          </div>
        </div>



        <div class="section_buscar">
          <div class="item_buscar">
            <label>preferências</label>
            <div>
              <select class="inp" id="sel_preferencia">
                <option class="option" selected disabled value="#"></option>
                <option class="option" value="almoco">Almoço</option>
                <option class="option" value="janta">Janta</option>
              </select>
            </div>
          </div>

          <div class="item_buscar">
            <div class="checkbox">
              <input type="checkbox" id="inp_novidade" />
              <label for="novidade">Novidade!</label>
            </div>
          </div>
        </div>

      </div>

      <div>
        <button onclick="buscar()" class="button1">BUSCAR!</button>
      </div>
    </div>
  </div>


  <div class="sugestao">
    <div class="container">

      <div class="boxes">
        <h1 id="sugestao">SUGESTÕES:</h1>

        <div class="box_cadastro" id="aparecer">
          <div class="restaurante" id="restaurante">
            <span id="nome_restaurante" class="box_restaurante"></span>
            <span id="categoria_vibe"></span>
          </div>
        </div>

        <div>
          <a href="cadastro_restaurante.html" class="box_cadastro">+
            <span>Adicionar novo restaurante</span>
          </a>
        </div>

      </div>
    </div>
  </div>
  </div>

  <script>
    function esconder() {
      document.getElementById('aparecer').style.display = 'none';
    }
  </script>

</body>

</html>
<script>
  listaVibe = ['Aconchegante', 'Romântica', 'Despojada', 'Clássica', 'Chique'];
  listaCategoria = ['Hamburguer', 'Pizza', 'Sushi', 'Comida', 'Massa', 'Hotdog', 'Pastel'];

  function buscar() {
    document.getElementById('aparecer').style.display = 'flex';
    window.location.href = "#sugestao";

    let vibe = sel_vibe.value;
    let categoria = sel_categoria.value;
    let preferencia = sel_preferencia.value;
    let novidade = inp_novidade.checked;

    let fkUsuario = sessionStorage.ID_USUARIO;


    fetch("http://localhost:3333/restaurantes/buscar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/restaurantes.js
        categoriaServer: categoria,
        vibeServer: vibe,
        preferenciaServer: preferencia,
        fkUsuarioServer: fkUsuario
      }),
    })

      .then(function (resposta) {
        return resposta.json();
      })

      .then(function (dados) {
        aparecer.style.display = "flex";

        for (let i = 0; i < dados.length; i++) {

          let estrelas = "☆☆☆☆☆";

          if (dados[i].classificacao) {
            estrelas =
              "★".repeat(dados[i].classificacao) +
              "☆".repeat(5 - dados[i].classificacao);
          }

          console.log(dados[i].idRestaurante);
          restaurante.innerHTML +=
            `<a href="restaurante.html?id=${dados[i].idRestaurante}">
          <div class="box_restaurante">
            <h2>${dados[i].nomeRestaurante}</h2>
            <p>Categoria: ${dados[i].categoria}</p>
            <p>Vibe: ${dados[i].vibe}</p>
            <p class="star">${estrelas}</p>
          </div>
          </a>`;

        }
      })
      .catch(function (erro) {
        console.log(erro);
      });
  }
</script>
