        "Ficar em um lugar confortável e calmo"

        "Pop ou rap",

        "Algo divertido e sem planos com os amigos"

    let lista_D = [

        "Nostálgico e atemporal",
        "Objetos e jogos antigos, cartazes vintage e luzes amareladas",
        "MPB antigo",
        "Nostalgia",
        "Relembrar bons momentos",
        "Reviver algo especial do passado"

    ];

    let lista_E = [

    let quantidadeDeQuestoes = lista_pergunta.length;
    let aconchegante = 1;
    let romantica = 1;
    let despojada = 1;
    let classica = 1;
    let chique = 1;
    let atual = 0;

    function esconder() {
        document.getElementById('jogo').style.display = "none";
        document.getElementById('fim').style.display = "none";
    }

    function mostrar_respostas() {
        pergunta.innerHTML = lista_pergunta[atual];
        primeiraOpcao.innerHTML = lista_A[atual];
        segundaOpcao.innerHTML = lista_B[atual];
        terceiraOpcao.innerHTML = lista_C[atual];
        quartaOpcao.innerHTML = lista_D[atual];
        quintaOpcao.innerHTML = lista_E[atual];
    }

    function iniciar() {

        document.getElementById('jogo').style.display = "flex";
        document.getElementById('inicar_jogo').style.display = "none";
        mostrar_respostas();

    }

    function escolherA() {

        if (atual == 0) {
            aconchegante = 20;
            atual++;
            mostrar_respostas();

        } else if (atual == 1) {
            aconchegante += 8;
            mostrar_respostas();

        } else if (atual == 2) {
            aconchegante += 3;
            mostrar_respostas();

        } else if (atual == 3) {
            aconchegante += 10;
            mostrar_respostas();

        } else if (atual == 4) {
            aconchegante += 15;
            mostrar_respostas();

        } else if (atual == 5) {
            aconchegante += 6;
            mostrar_respostas();

        } else {
            document.getElementById('fim').style.display = "flex";
            document.getElementById('jogo').style.display = "none";
            salvar_resposta();

            setTimeout(() => {
                mostrar_grafico();;
            }, 1000);

        }

        atual++;
    }

    function ver_resultado() {
        document.getElementById('fim').style.display = "flex";
        document.getElementById('jogo').style.display = "none";
        document.getElementById('inicar_jogo').style.display = "none";
        window.location.href = "#dash";
        mostrar_grafico();
    }

    function salvar_resposta() {
        let fkUsuario = sessionStorage.ID_USUARIO;

        // Enviando o valor da nova input
        fetch("http://localhost:3333/restaurantes/salvarResposta", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                fkUsuarioServer: fkUsuario,
                aconcheganteServer: aconchegante,
                romanticaServer: romantica,
                despojadaServer: despojada,
                classicaServer: classica,
                chiqueServer: chique

            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {

                    setTimeout(() => {

                    }, "2000");

                } else {
                    throw "Houve um erro ao tentar salvar respostas!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }


    function mostrar_grafico() {
        let fkUsuario = sessionStorage.ID_USUARIO;

        fetch(`http://localhost:3333/restaurantes/buscarResultado/${fkUsuario}`, {
            method: "GET"

        })
            .then(resposta => resposta.json())
            .then(dados => {
                let resultado = dados[0];

                aconchegante = resultado.aconchegante;
                romantica = resultado.romantica;
                despojada = resultado.despojada;
                classica = resultado.classica;
                chique = resultado.chique;

                let listaVibe = [resultado.aconchegante, resultado.romantica, resultado.despojada, resultado.classica, resultado.chique];
                let listaNomeVibe = ['ACONCHEGANTE', 'ROMÂNTICA', 'DESPOJADA', 'CLÁSSICA', 'CHIQUE'];
                let maiorVibe = Math.max(...listaVibe);
                let index = listaVibe.indexOf(maiorVibe);

                kpi1.innerHTML += `<p>VIBE DO MOMENTO:<br>${listaNomeVibe[index]}</p>`;

                const ctx1 = document.getElementById('grafico1');

                new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: ['Aconchegante', 'Romântica', 'Despojada', 'Clássica', 'Chique'],
                        datasets: [{
                            label: 'Sua pontuação',

                            data: [
                                aconchegante,
                                romantica,
                                despojada,
                                classica,
                                chique
                            ],
                            borderColor: 'rgb(36, 54, 78)',
                            backgroundColor: 'rgb(36, 54, 78)',
                            borderWidth: 1,
                            borderRadius: 10
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });

            })
            .catch(erro => {
                console.log(erro);
            });

        fetch(`http://localhost:3333/restaurantes/favoritos`, {
            method: "GET"

        })
            .then(resposta => resposta.json())
            .then(dados => {
                console.log(dados);
                let nomes = [];
                let resultados = [];

                for (let i = 0; i < dados.length; i++) {
                    nomes.push(dados[i].nomeRestaurante);
                    resultados.push(dados[i].media);
                }

                kpi2.innerHTML += `<p>TOP 1 DOS USUÁRIOS:<br>${nomes[0]}</p>`;

                const ctx1 = document.getElementById('grafico2');

                new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: nomes,
                        datasets: [{
                            label: 'Favoritos dos usuários',

                            data: resultados,

                            borderColor: 'rgb(36, 54, 78)',
                            backgroundColor: 'rgb(36, 54, 78)',
                            borderWidth: 1,
                            borderRadius: 10
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });

            })
            .catch(erro => {
                console.log(erro);
            });

    }

</script>
